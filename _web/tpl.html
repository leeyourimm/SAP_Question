<title>SAP 서면 문제집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 문제집 색인. 왼쪽 유형 레일(트랜잭션 코드 라벨) + 오른쪽 접히는 문제 카드 목록 */
:root{
  --bg:#f4f6f3; --panel:#ffffff; --fg:#18211e; --muted:#5b6762; --line:#d9e0dc;
  --accent:#1d6b58; --accent-soft:#e1efe9; --star:#b7791f; --code-bg:#eef2ef;
  --ok:#2f7d32; --tag-off:#e6ecf5; --tag-off-fg:#2b4a7a; --tag-self:#efece4; --tag-self-fg:#6b5a2e;
  --k:#7a2fa0; --s:#a14a12; --c:#6f7d77; --n:#1d5e9e; --m:#0f7b6c;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-code:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --fg:#e2e9e5; --muted:#99a7a1; --line:#2b3632;
  --accent:#62c3a6; --accent-soft:#1d2f29; --star:#e0aa4f; --code-bg:#0d1311;
  --ok:#7cc47f; --tag-off:#1c2a3d; --tag-off-fg:#a9c2ea; --tag-self:#2c281e; --tag-self-fg:#d9c79a;
  --k:#d29bf0; --s:#f0a36e; --c:#7f8e88; --n:#82b8ef; --m:#5fd1bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --fg:#e2e9e5; --muted:#99a7a1; --line:#2b3632;
  --accent:#62c3a6; --accent-soft:#1d2f29; --star:#e0aa4f; --code-bg:#0d1311;
  --ok:#7cc47f; --tag-off:#1c2a3d; --tag-off-fg:#a9c2ea; --tag-self:#2c281e; --tag-self-fg:#d9c79a;
  --k:#d29bf0; --s:#f0a36e; --c:#7f8e88; --n:#82b8ef; --m:#5fd1bd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--f-ui);}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:end;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:16px}
.top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.top h1 span{color:var(--accent)}
.top .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.tools input[type=search]{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:220px;max-width:100%}
.chip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible,.nav-i:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-i{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
.nav-i:hover{background:var(--accent-soft)}
.nav-i.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-code{font-family:var(--f-code);font-weight:700;color:var(--accent);text-align:center;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:22px}
.nav-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail .legend{margin-top:14px;padding:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:grid;gap:4px}
main{min-width:0;display:flex;flex-direction:column;gap:40px}
.sec-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.sec-tag{flex:none;width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--panel);font:700 22px/44px var(--f-code);text-align:center}
.sec-h h2{margin:0;font-size:21px;font-weight:600;letter-spacing:.02em}
.sec-h .cnt{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.sec-h .tool{margin:0;font:12px var(--f-code);color:var(--accent);letter-spacing:.04em}
.sec-h .desc{margin:4px 0 0;color:var(--muted);max-width:68ch;font-size:14px}
.group{margin-top:18px}
.group h3{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.group h3 small{font-weight:400;margin-left:4px}
.card{border-top:1px solid var(--line)}
.group .card:last-child{border-bottom:1px solid var(--line)}
details.prob>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:11px 6px;cursor:pointer}
details.prob>summary::-webkit-details-marker{display:none}
details.prob>summary:hover{background:var(--accent-soft)}
.pid{font:700 12px var(--f-code);color:var(--accent);min-width:42px;font-variant-numeric:tabular-nums}
.ttl{flex:1 1 240px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.diff{display:inline-flex;gap:2px;align-items:center}
.diff i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.diff i.on{background:var(--star)}
.diff b{font-size:11px;color:var(--star);margin-left:3px}
.src{font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.src-official,.src-mixed{background:var(--tag-off);color:var(--tag-off-fg)}
.src-self,.src-public{background:var(--tag-self);color:var(--tag-self-fg)}
.done{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
.done input{accent-color:var(--ok);margin:0}
.card.is-done .ttl{color:var(--muted)}
.card.is-done .done{color:var(--ok)}
.body{padding:4px 6px 22px 60px;min-width:0}
.body p,.body li{max-width:75ch}
.body h4,.body h3{font-size:15px}
.body table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.body :not(pre)>code{overflow-wrap:anywhere}
.body code{font-family:var(--f-code);font-size:.92em;background:var(--code-bg);padding:1px 4px;border-radius:3px}
.hl{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;overflow-x:auto;margin:10px 0}
.hl pre{margin:0;padding:12px 14px;font:13px/1.55 var(--f-code);tab-size:2}
.hl pre code,.body pre code{background:none;padding:0}
.body pre{overflow-x:auto}
.hl .k,.hl .ow,.hl .kn{color:var(--k);font-weight:700}
.hl .s,.hl .s1,.hl .s2,.hl .sx{color:var(--s)}
.hl .c,.hl .c1,.hl .cm{color:var(--c);font-style:italic}
.hl .nf,.hl .nb,.hl .nv{color:var(--n)}
.hl .mi,.hl .mf,.hl .m{color:var(--m)}
.hl .err{border:0;background:none;color:inherit}
details.ans{margin-top:14px;border:1px dashed var(--line);border-radius:6px}
details.ans>summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--accent)}
details.ans[open]>summary{border-bottom:1px dashed var(--line)}
.ans-body{padding:4px 12px 8px;min-width:0}
.empty{color:var(--muted);padding:30px 0}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;flex-direction:row;overflow-x:auto;background:var(--bg);padding-block:6px;border-bottom:1px solid var(--line)}
  .nav-i{grid-template-columns:auto auto;white-space:nowrap}
  .nav-n,.rail .legend{display:none}
  .body{padding-left:6px}
  .tools{margin-left:0}
  .tools .row{justify-content:flex-start}
  .tools input[type=search]{width:100%}
}
@media (prefers-reduced-motion:no-preference){details.prob>summary{transition:background .15s}}
.ty{font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap;background:var(--tag-off);color:var(--tag-off-fg)}
.ty.t1{background:var(--accent-soft);color:var(--accent)}
.ty.t2{background:var(--tag-self);color:var(--tag-self-fg)}
.sup{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--star);color:var(--star);white-space:nowrap}
.chip small{color:inherit;opacity:.7;font-size:11px}
.tools .row{display:flex;flex-wrap:wrap;gap:6px;width:100%;justify-content:flex-end}
textarea.draft{display:block;width:100%;max-width:75ch;margin-top:14px;font:13px/1.5 var(--f-code);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);resize:vertical}
.intro{font-size:14px;color:var(--muted);max-width:75ch;margin:0 0 10px}
.intro p{margin:4px 0}
.srcline{font-size:11px;color:var(--muted);margin:8px 0 0}
.srcline:empty{display:none}
.exam-bar{grid-column:1/-1;display:none;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);font-size:14px}
.exam-bar.on{display:flex;flex-wrap:wrap}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>SAP 서면 <span>문제집</span></h1>
      <div class="meta">ABAP · RAP · SAPUI5 서면 시험 대비 %%TOTAL%%문제 · <span id="doneCount">0</span>개 풀었음</div>
    </div>
    <div class="tools">
      <div class="row">
        <input type="search" id="q" placeholder="문제 검색 (예: BDEF, binding, FOR ALL ENTRIES)" aria-label="문제 검색">
        <button class="chip" data-d="all" aria-pressed="true">전체 난이도</button>
        <button class="chip" data-d="1" aria-pressed="false">★1</button>
        <button class="chip" data-d="2" aria-pressed="false">★2</button>
        <button class="chip" data-d="3" aria-pressed="false">★3</button>
      </div>
      <div class="row">
        %%TYPECHIPS%%
      </div>
      <div class="row">
        <button class="chip" id="exam" aria-pressed="false">모의고사 10문제</button>
        <button class="chip" id="hideDone" aria-pressed="false">푼 문제 숨기기</button>
        <button class="chip" id="toggleAll" aria-pressed="false">전부 펼치기</button>
      </div>
    </div>
  </div>
  <div class="exam-bar" id="examBar"><b>모의고사</b><span>현재 필터 안에서 무작위로 고른 10문제입니다. 답을 종이에 먼저 쓰고 채점하세요.</span><span id="timer">00:00</span><button class="chip" id="reshuffle">다시 뽑기</button></div>

  <nav class="rail" aria-label="단원">
    %%NAV%%
    <div class="legend">
      <div>유형: 개념(서술·객관식·표) · 코드(결과·빈칸·오류) · 작성(코드 직접 쓰기). 문제마다 소문항 여러 개를 묶었습니다.</div>
            <div>"풀었음"과 내 답안은 이 브라우저에만 저장됩니다.</div>
    </div>
  </nav>

  <main id="list">
    %%SECTIONS%%
    <p class="empty" id="empty" hidden>조건에 맞는 문제가 없습니다. 검색어나 필터를 바꿔 보세요.</p>
  </main>
</div>

<script>
(function(){
  const cards=[...document.querySelectorAll('.card')];
  const secs=[...document.querySelectorAll('section.sec')];
  const q=document.getElementById('q');
  let diff='all', types=new Set(), hideDone=false, exam=null, t0=0, tick=null;
  const KEY='sap-written-done', DKEY='sap-written-draft';
  function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}}
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  const done=load(KEY), drafts=load(DKEY);
  function paintDone(){
    let n=0;
    cards.forEach(c=>{const on=!!done[c.id];c.classList.toggle('is-done',on);c.querySelector('label.done input').checked=on;if(on)n++;});
    document.getElementById('doneCount').textContent=n;
  }
  document.querySelectorAll('label.done').forEach(l=>l.addEventListener('click',e=>e.stopPropagation()));
  document.querySelectorAll('details.prob>summary').forEach(s=>s.addEventListener('click',e=>{if(e.target.closest('label.done'))e.preventDefault();}));
  document.querySelectorAll('label.done input').forEach(cb=>cb.addEventListener('change',()=>{
    if(cb.checked)done[cb.dataset.id]=1;else delete done[cb.dataset.id];store(KEY,done);paintDone();apply();
  }));
  document.querySelectorAll('textarea.draft').forEach(t=>{
    t.value=drafts[t.dataset.id]||'';
    t.addEventListener('input',()=>{if(t.value)drafts[t.dataset.id]=t.value;else delete drafts[t.dataset.id];store(DKEY,drafts);});
  });
  function base(c){
    const t=q.value.trim().toLowerCase();
    if(t && !(c.dataset.text.includes(t)||c.id.toLowerCase()===t)) return false;
    if(diff!=='all' && c.dataset.diff!==diff) return false;
    if(types.size && !types.has(c.dataset.type)) return false;
    if(hideDone && done[c.id]) return false;
    return true;
  }
  function apply(){
    let shown=0;
    cards.forEach(c=>{const ok=exam? exam.has(c.id) : base(c); c.hidden=!ok; if(ok)shown++;});
    document.querySelectorAll('.group').forEach(g=>{g.hidden=![...g.querySelectorAll('.card')].some(c=>!c.hidden)});
    secs.forEach(s=>{s.hidden=![...s.querySelectorAll('.card')].some(c=>!c.hidden)});
    document.getElementById('empty').hidden=shown>0;
  }
  q.addEventListener('input',apply);
  document.querySelectorAll('.chip[data-d]').forEach(b=>b.addEventListener('click',()=>{
    diff=b.dataset.d;document.querySelectorAll('.chip[data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b));apply();
  }));
  document.querySelectorAll('.chip[data-t]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.t; if(types.has(t))types.delete(t);else types.add(t);
    b.setAttribute('aria-pressed',types.has(t));apply();
  }));
  const hd=document.getElementById('hideDone');
  hd.addEventListener('click',()=>{hideDone=!hideDone;hd.setAttribute('aria-pressed',hideDone);apply();});
  const ta=document.getElementById('toggleAll');
  ta.addEventListener('click',()=>{
    const open=ta.getAttribute('aria-pressed')!=='true';
    ta.setAttribute('aria-pressed',open);ta.textContent=open?'전부 접기':'전부 펼치기';
    cards.forEach(c=>{if(!c.hidden)c.querySelector('details.prob').open=open;});
  });
  const ex=document.getElementById('exam'), bar=document.getElementById('examBar'), tm=document.getElementById('timer');
  function draw(){
    const pool=cards.filter(base).map(c=>c.id);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    exam=new Set(pool.slice(0,10));
    cards.forEach(c=>{c.querySelector('details.ans').open=false;});
    t0=Date.now(); apply(); window.scrollTo(0,0);
  }
  function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  ex.addEventListener('click',()=>{
    const on=ex.getAttribute('aria-pressed')!=='true';
    ex.setAttribute('aria-pressed',on); bar.classList.toggle('on',on);
    if(on){draw(); tick=setInterval(()=>{tm.textContent=fmt(Date.now()-t0)},1000);}
    else{exam=null; clearInterval(tick); tm.textContent='00:00'; apply();}
  });
  document.getElementById('reshuffle').addEventListener('click',draw);
  const navs=[...document.querySelectorAll('.nav-i')];
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){navs.forEach(n=>n.classList.toggle('on',n.dataset.sec===en.target.dataset.sec));}})},{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(s=>io.observe(s));
  function openHash(){const id=location.hash.slice(1);const el=id&&document.getElementById(id);if(el&&el.classList.contains('card')){el.querySelector('details.prob').open=true;el.scrollIntoView();}}
  window.addEventListener('hashchange',openHash);
  paintDone();apply();openHash();
})();
</script>
